name: Secrets Drill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dotenv (will fail) or env_var (will work)"
        required: true
        default: "dotenv"
        type: choice
        options:
          - dotenv
          - env_var

jobs:
  run-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Note: this checkout is a FRESH clone from GitHub. The local
      # .env file is gitignored, so it was NEVER pushed — it does not
      # exist here. That's the whole drill.

      - name: Run 1 - dotenv mode (expected to fail)
        if: github.event.inputs.mode == 'dotenv'
        run: python token_task.py

      - name: Run 2 - env_var mode (reads from GitHub Actions secret)
        if: github.event.inputs.mode == 'env_var'
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: python token_task.py
